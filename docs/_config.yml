title: DDB Gamelog for Owlbear Rodeo
description: Documentation for the DDB Gamelog extension for Owlbear Rodeo.
url: https://iamwarhead.github.io
baseurl: /ddb-game-log-for-obr

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

# Without this every page renders as bare HTML, with no theme and no stylesheet.
defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

# Shows a labelled box where an image is missing from assets/img. Set to false once the images are in.
image_placeholders: false

aux_links:
  Discord: https://discord.com/invite/HSTtrphyFg
  Patreon: https://www.patreon.com/iamwarhead/

footer_content: "DDB Gamelog for Owlbear Rodeo by Roland Hegedus. All rights reserved."

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

exclude:
  - assets/img/README.md
